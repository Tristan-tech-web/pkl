name: Database
# Menerapkan migrasi di supabase/migrations dan menjalankan tes SQL pada proyek Supabase dev.
# Aktif hanya bila variabel repo DB_CI = true dan secret berikut sudah diatur:
# SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD.
on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/database.yml"

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrate-and-test:
    if: ${{ vars.DB_CI == 'true' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --yes
      - name: Tes isolasi RLS
        run: ./scripts/run-sql-tests.sh
